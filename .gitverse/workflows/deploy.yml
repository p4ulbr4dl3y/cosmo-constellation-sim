name: Deploy to GitVerse Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitverse-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run Ruff Linter
        working-directory: ./backend
        run: uv run ruff check

      - name: Run Ruff Format Check
        working-directory: ./backend
        run: uv run ruff format --check

      - name: Run Pytest
        working-directory: ./backend
        run: uv run pytest

      - name: Verify Parity Fixture Up-to-date
        working-directory: ./backend
        run: |
          uv run python scripts/generate_parity_fixture.py
          git diff --exit-code ../frontend/src/lib/__fixtures__/parity_fixture.json

  frontend-checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Verify TypeScript & Build
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy to GitVerse Pages
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build site
        working-directory: ./frontend
        run: npm run build

      - name: Upload Pages Artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: ./frontend/dist

      - name: Deploy to GitVerse Pages
        uses: gitverse/deploy-pages@v1.0.0
