<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Orbit back arc -->
  <g transform="rotate(-28 50 50)">
    <path d="M 8 50 A 42 16 0 0 1 92 50" fill="none" stroke="#0369a1" stroke-width="4.5" stroke-linecap="round" opacity="0.45" />
  </g>
  <!-- Planet -->
  <circle cx="50" cy="50" r="20" fill="url(#planetGrad)" />
  <!-- Orbit front arc -->
  <g transform="rotate(-28 50 50)">
    <path d="M 92 50 A 42 16 0 0 1 8 50" fill="none" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="84" cy="58" r="6" fill="#ffffff" />
    <circle cx="84" cy="58" r="3.5" fill="#0284c7" />
  </g>
</svg>