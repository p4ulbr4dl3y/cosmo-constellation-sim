name: CI and Deploy to Pages & VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/pyproject.toml'

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run Ruff Linter
        working-directory: ./backend
        run: uv run ruff check

      - name: Run Ruff Format Check
        working-directory: ./backend
        run: uv run ruff format --check

      - name: Run Pytest
        working-directory: ./backend
        run: uv run pytest

      - name: Verify Parity Fixture Up-to-date
        working-directory: ./backend
        run: |
          uv run python scripts/generate_parity_fixture.py
          git diff --exit-code ../frontend/src/lib/__fixtures__/parity_fixture.json

  frontend-checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Stash build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [frontend-checks]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup GitHub Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages Artifact
        id: upload_pages
        if: steps.setup_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload_pages.outcome == 'success'
        uses: actions/deploy-pages@v4

  deploy-vps:
    name: Deploy to VPS
    needs: [backend-checks, frontend-checks]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET_DIR: ${{ secrets.VPS_TARGET_DIR || '/var/www/state3407/cosmo-constellation-sim' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "VPS secrets not configured. Skipping VPS deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $TARGET_DIR /opt/cosmo"
          rsync -avz -e "ssh -p $VPS_PORT" --delete frontend/dist/ "$VPS_USER@$VPS_HOST:$TARGET_DIR"
          rsync -avz -e "ssh -p $VPS_PORT" --delete --exclude ".git" --exclude "node_modules" --exclude ".venv" --exclude "__pycache__" --exclude ".pytest_cache" backend data docs compose.yml "$VPS_USER@$VPS_HOST:/opt/cosmo/"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd /opt/cosmo && BACKEND_PORT=8008 ROOT_PATH=/cosmo docker compose up -d --build backend"
