name: CI and Deploy to Pages & VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'deploy'
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run Ruff Linter
        working-directory: ./backend
        run: uv run ruff check

      - name: Run Ruff Format Check
        working-directory: ./backend
        run: uv run ruff format --check

      - name: Run Pytest with Coverage
        working-directory: ./backend
        run: uv run pytest --cov=app --cov-report=term

      - name: Verify Parity Fixture Up-to-date
        working-directory: ./backend
        run: |
          uv run python scripts/generate_parity_fixture.py
          git diff --exit-code ../frontend/src/lib/__fixtures__/parity_fixture.json

  frontend-checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Verify TypeScript & Build
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy to Pages & VPS
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        id: build
        working-directory: ./frontend
        run: npm run build

      - name: Setup GitHub Pages
        id: setup_pages
        continue-on-error: true
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        id: upload_pages
        if: steps.setup_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to VPS
        if: always() && steps.build.outcome == 'success'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET_DIR: ${{ secrets.VPS_TARGET_DIR || '/var/www/state3407/cosmo-constellation-sim' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "VPS secrets (VPS_SSH_KEY, VPS_HOST, VPS_USER) not fully configured. Skipping VPS deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $TARGET_DIR"
          rsync -avz -e "ssh -p $VPS_PORT" --delete frontend/dist/ "$VPS_USER@$VPS_HOST:$TARGET_DIR"
